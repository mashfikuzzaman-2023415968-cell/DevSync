- id: flutter-widgets-layout-01
  competency: widgets_layout
  difficulty: 3
  text: On a narrow phone this screen shows the error 'A RenderFlex overflowed by 84 pixels on the right'.
    Which change fixes it?
  code_snippet: |
    Row(
      children: [
        Text('A very long title that does not fit on one line on small screens'),
        Icon(Icons.star),
      ],
    )
  options:
  - Wrap the Text in an Expanded widget
  - 'Add overflow: TextOverflow.ellipsis to the Text only'
  - Wrap the Row in a Container
  - Put the Row inside a Column
  correct_index: 0
  explanation: A Row gives its non-flex children unbounded width, so a long Text just keeps growing. Expanded
    (or Flexible) gives the Text the remaining width, which lets it wrap or ellipsize. The overflow property
    alone does not constrain the width, and Container or Column do not change the Row's behaviour.
  check: manual
