- id: flutter-state-management-03
  competency: state_management
  difficulty: 3
  text: After `add()` runs, the ValueListenableBuilder listening to `items` does not rebuild. Why?
  code_snippet: |
    final items = ValueNotifier<List<int>>([1, 2, 3]);

    void add() {
      items.value.add(4);
    }
  options:
  - A ValueNotifier only notifies when a different value is assigned; mutating the same list does not
  - ValueNotifier supports only int and String values
  - add() must be called inside setState to notify listeners
  - ValueListenableBuilder needs a Key to rebuild
  correct_index: 0
  explanation: ValueNotifier compares the new value with the old one in its value setter and notifies
    only if they differ. add() mutates the existing list object, so nothing is notified. Assign a new
    list, for example `items.value = [...items.value, 4];`.
  check: manual
