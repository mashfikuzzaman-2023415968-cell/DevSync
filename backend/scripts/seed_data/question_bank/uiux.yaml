- id: uiux-accessibility-01
  competency: accessible_design
  difficulty: 2
  text: A screen reader announces only 'button' for this control. What is the right fix?
  code_snippet: |
    <button class="icon-btn">
      <svg viewBox="0 0 24 24" aria-hidden="true">...</svg>
    </button>
  options:
  - Add a title attribute to the svg element
  - Increase the size of the icon
  - Give the button an accessible name, such as aria-label="Delete message"
  - Remove the button and use a div with an onclick handler
  correct_index: 2
  explanation: A button with only an icon has no text for assistive technology. An accessible name from
    visible or visually hidden text, or an aria-label, tells users what it does. A div without role and
    keyboard support would be worse, and size does not help.
