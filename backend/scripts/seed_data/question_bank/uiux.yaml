- id: uiux-usability-01
  competency: usability
  difficulty: 1
  text: A project settings page has a 'Delete project' button right next to 'Edit'. Users sometimes delete
    projects by accident. Which change best follows usability principles?
  options:
  - Separate the button visually and offer undo or a confirmation that names the project
  - Make Delete the primary-coloured button so it is easier to find
  - Add a tooltip that explains what Delete does
  - Remove all confirmations so users can work faster
  correct_index: 0
  explanation: Error prevention and error recovery are core usability heuristics. Putting a destructive
    action apart from safe ones and offering undo or a specific confirmation reduces slips. A prominent
    Delete button makes accidents more likely, and a tooltip is too easy to miss.
