- id: uiux-accessibility-02
  competency: accessible_design
  difficulty: 3
  text: A modal dialog opens, but keyboard focus stays on the page behind it, and Tab moves through hidden
    page controls. What is the correct behaviour?
  options:
  - Leave focus where it is so users keep their place
  - Move focus to the browser address bar
  - Disable the Tab key on the whole page
  - Move focus into the dialog, keep Tab inside it while open, and return focus to the trigger on close
  correct_index: 3
  explanation: Keyboard and screen-reader users must be taken into a modal, kept inside it (focus trap)
    and returned to the triggering element afterwards. Leaving focus behind makes the dialog unreachable
    and exposes content that is visually covered.
  status: APPROVED
