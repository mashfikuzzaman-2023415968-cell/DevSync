- id: uiux-layout-hierarchy-02
  competency: layout_hierarchy
  difficulty: 2
  text: In a form, labels sit midway between two fields, so it is hard to tell which field each label
    belongs to. Which fix applies the principle of proximity?
  options:
  - Make all labels bold
  - Put every label and field inside a border
  - Place each label closer to its own field than to the neighbouring field
  - Use a different colour for each label
  correct_index: 2
  explanation: The Gestalt principle of proximity says elements that sit close together are perceived
    as a group. Moving each label nearer to its field than to the next one removes the ambiguity. Bold,
    borders and colour do not fix the spacing.
  status: APPROVED
  source: CLAUDE_GENERATED
