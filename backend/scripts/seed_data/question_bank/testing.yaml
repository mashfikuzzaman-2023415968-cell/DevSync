- id: testing-unit-testing-02
  competency: unit_testing
  difficulty: 2
  text: What does pytest report for this test?
  code_snippet: |
    import pytest

    def withdraw(balance, amount):
        if amount > balance:
            raise ValueError("insufficient funds")
        return balance - amount

    def test_overdraw():
        with pytest.raises(ValueError, match="Insufficient"):
            withdraw(50, 80)
  options:
  - 'Passes: a ValueError is raised, and match ignores case by default'
  - 'Passes: match is only checked when the exception type is wrong'
  - 'Errors during collection: match needs a compiled regex pattern'
  - 'Fails: the pattern does not match, as matching is case-sensitive'
  correct_index: 3
  explanation: pytest.raises(match=...) applies re.search to the exception text, which is case-sensitive.
    'insufficient funds' does not contain 'Insufficient', so the test fails with 'Regex pattern did not
