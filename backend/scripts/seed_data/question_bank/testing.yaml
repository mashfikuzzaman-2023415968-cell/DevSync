- id: testing-test-design-03
  competency: test_design
  difficulty: 3
  text: 'A search page has three filters: category (4 options), stock status (2 options) and price band
    (3 options). What is the smallest number of tests that covers every pair of values taken from any
    two filters (pairwise coverage)?'
  options:
  - '4'
  - '9'
  - '12'
  - '24'
  correct_index: 2
  explanation: Category and price band alone have 4 x 3 = 12 distinct pairs, and one test covers only
    one such pair, so 12 is a lower bound. Assigning stock status alternately (for example (category +
    price) mod 2) covers its pairs too, so 12 suffices. 24 is all combinations, 4 only covers each value
    once.
  status: APPROVED
