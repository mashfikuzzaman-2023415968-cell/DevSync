- id: testing-unit-testing-01
  competency: unit_testing
  difficulty: 2
  text: Which test fails when this file is run with pytest?
  code_snippet: |
    def test_round():
        assert round(2.5) == 2

    def test_sum():
        assert 0.1 + 0.2 == 0.3

    def test_floor():
        assert 7 // 2 == 3

    def test_neg_floor():
        assert -7 // 2 == -4
  options:
  - test_round
  - test_floor
  - test_sum
  - test_neg_floor
  correct_index: 2
  explanation: 0.1 + 0.2 is 0.30000000000000004 in binary floating point, so == 0.3 fails (pytest.approx
    is the fix). round(2.5) is 2 (round half to even), 7 // 2 is 3 and -7 // 2 is -4 (floor division),
    so those pass.
  check: execution
