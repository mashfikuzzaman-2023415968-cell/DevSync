- id: postgresql-legacy-01
  competency: transactions_concurrency
  difficulty: 2
  text: Which isolation level is PostgreSQL's default?
  options:
  - Repeatable read
  - Serializable
  - Read committed
  - Read uncommitted
  correct_index: 2
  explanation: 'PostgreSQL''s default isolation level is READ COMMITTED: each statement sees the data
    committed before that statement started. REPEATABLE READ and SERIALIZABLE must be requested explicitly,
    and READ UNCOMMITTED is accepted but behaves like READ COMMITTED.'
  status: APPROVED
