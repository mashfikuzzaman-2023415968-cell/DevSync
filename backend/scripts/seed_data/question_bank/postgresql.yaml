- id: postgresql-data-modelling-03
  competency: data_modelling
  difficulty: 2
  text: A column is declared numeric(6,2) and the value 1234.567 is inserted. What does the SELECT on
    line 3 return?
  code_snippet: |
    1  CREATE TABLE price (amount numeric(6,2));
    2  INSERT INTO price VALUES (1234.567);
    3  SELECT amount FROM price;
  options:
  - '1234.56'
  - '1234.567'
  - '1234.57'
  - 'An error: numeric field overflow'
  correct_index: 2
  explanation: numeric(6,2) allows 6 digits in total with 2 after the point, so up to 9999.99. The input
