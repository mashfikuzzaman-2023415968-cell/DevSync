- id: postgresql-data-modelling-07
  competency: data_modelling
  difficulty: 3
  text: After an insert that was skipped by ON CONFLICT DO NOTHING, which id does the statement on line
    4 return?
  code_snippet: |
    1  CREATE TABLE tags (id serial PRIMARY KEY, name text UNIQUE);
    2  INSERT INTO tags (name) VALUES ('sql');
    3  INSERT INTO tags (name) VALUES ('sql') ON CONFLICT DO NOTHING;
    4  INSERT INTO tags (name) VALUES ('db') RETURNING id;
  options:
  - '1'
  - '2'
  - '3'
  - '4'
  correct_index: 2
  explanation: The default nextval('tags_id_seq') is evaluated before the conflict check, so the ignored
    insert on line 3 still consumes id 2. Sequences are not gapless and are never rolled back, so 'db'
    gets 3.
  check: execution
  status: APPROVED
