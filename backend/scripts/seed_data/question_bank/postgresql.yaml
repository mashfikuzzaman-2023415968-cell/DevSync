- id: postgresql-data-modelling-06
  competency: data_modelling
  difficulty: 3
  text: A tickets table uses a GENERATED ALWAYS identity column. What happens when line 5 runs?
  code_snippet: |
    1  CREATE TABLE tickets (
    2    id int GENERATED ALWAYS AS IDENTITY,
    3    title text
    4  );
    5  INSERT INTO tickets (id, title) VALUES (10, 'a');
  options:
  - It succeeds and stores id 10
  - It succeeds, ignores the 10 and stores id 1
  - It succeeds and the next generated id becomes 11
  - It fails because a non-DEFAULT value cannot be inserted into an identity column
  correct_index: 3
  explanation: GENERATED ALWAYS AS IDENTITY rejects explicit values unless OVERRIDING SYSTEM VALUE is
    given (error 428C9). Only GENERATED BY DEFAULT accepts an explicit id, and even then the sequence
    is not advanced by it.
  check: execution
