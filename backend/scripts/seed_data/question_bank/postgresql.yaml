- id: postgresql-legacy-02
  competency: indexes_performance
  difficulty: 2
  text: What is VACUUM used for?
  options:
  - Creating indexes
  - Backing up
  - Deleting tables
  - Reclaiming space from dead row versions and updating visibility information
  correct_index: 3
  explanation: UPDATE and DELETE leave dead row versions behind (MVCC). VACUUM makes that space reusable
    and updates the visibility map and statistics; autovacuum normally runs it. It does not create indexes,
    back up data or drop tables.
