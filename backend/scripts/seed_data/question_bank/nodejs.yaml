- id: nodejs-async-event-loop-02
  competency: async_event_loop
  difficulty: 3
  text: Inside the callback of an `fs.readFile` call, three things are scheduled as shown. In what order
    do they print?
  code_snippet: |
    const fs = require('fs');
    fs.readFile(__filename, () => {
      setTimeout(() => console.log('timeout'), 0);
      setImmediate(() => console.log('immediate'));
      Promise.resolve().then(() => console.log('promise'));
    });
  options:
  - promise, timeout, immediate
  - promise, immediate, timeout
  - immediate, promise, timeout
  - timeout, immediate, promise
  correct_index: 1
  explanation: When the callback ends, the microtask queue is drained first (promise). The callback runs
    in the poll phase, so the check phase (setImmediate) comes next, and the timer only fires on the next
    loop iteration. Inside an I/O callback, immediate always precedes timeout.
  check: execution
  status: APPROVED
  source: CLAUDE_GENERATED
  active: false
  review_level: SELF_VERIFIED
  reviewed_by_name: null
