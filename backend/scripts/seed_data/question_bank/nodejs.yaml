- id: nodejs-api-express-05
  competency: api_express
  difficulty: 2
  text: 'POST /orders with a JSON body fails with `TypeError: Cannot read properties of undefined (reading
    ''total'')`. What is the cause?'
  code_snippet: |
    app.post('/orders', (req, res) => {
      res.json({ total: req.body.total });
    });
    app.use(express.json());
  options:
  - The route should use app.put for bodies
  - req.body only exists on GET requests
  - express.json() must be called inside the handler
  - The body parser is registered after the route, so req.body is never populated
  correct_index: 3
  explanation: Middleware only affects handlers registered after it. Because express.json() comes after
    the POST route, req.body is still undefined when the handler runs. Register body parsers before the
    routes.
