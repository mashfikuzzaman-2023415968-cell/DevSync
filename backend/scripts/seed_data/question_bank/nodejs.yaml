- id: nodejs-async-event-loop-03
  competency: async_event_loop
  difficulty: 2
  text: What does this program print?
  code_snippet: |
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    async function main() {
      [1, 2, 3].forEach(async (n) => {
        await wait(10);
        console.log(n);
      });
      console.log('done');
    }
    main();
  options:
  - 1, 2, 3, done
  - 1, done, 2, 3
  - done, 1, 2, 3
  - done
  correct_index: 2
  explanation: forEach ignores the promises returned by its async callbacks, so main() does not wait for
    them. 'done' prints immediately, then the three timers fire in order. Use for...of with await, or
    Promise.all with map, to wait.
  check: execution
