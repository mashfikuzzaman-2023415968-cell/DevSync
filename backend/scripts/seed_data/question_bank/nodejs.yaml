  text: This script runs as a CommonJS file with `node app.js`. In what order does it print?
  code_snippet: |
    console.log('A');
    setTimeout(() => console.log('B'), 0);
    Promise.resolve().then(() => console.log('C'));
    process.nextTick(() => console.log('D'));
    console.log('E');
  options:
  - A, E, D, C, B
  - A, E, C, D, B
  - A, E, B, C, D
