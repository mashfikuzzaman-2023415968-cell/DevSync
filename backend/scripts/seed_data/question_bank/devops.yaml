  competency: containers
  difficulty: 2
  text: 'Builds are slow: every small source change reinstalls all dependencies. What is the best fix
    for this Dockerfile?'
  code_snippet: |
    FROM node:20-slim
    WORKDIR /app
    COPY . .
    RUN npm ci
    CMD ["node", "server.js"]
  options:
  - Copy package.json and the lock file and run npm ci before `COPY . .`
  - Replace `npm ci` with `npm install`
  - Move the CMD instruction above the COPY instruction
  - Change the base image tag to node:latest
  correct_index: 0
  explanation: Docker caches each layer and invalidates it, and every layer after it, when its inputs
    change. With `COPY . .` first, any source edit busts the cache for npm ci. Copying only the dependency
    manifests first keeps the install layer cached until they change.
