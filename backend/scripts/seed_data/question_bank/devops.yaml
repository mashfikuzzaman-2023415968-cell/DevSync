  competency: ci_cd
  difficulty: 2
  text: A pipeline step runs this shell script with `set -e`. What does it print?
  code_snippet: |
    set -e
    false || true
    echo "deploying"
  options:
  - Nothing, because false stops the script
  - deploying
  - Nothing, because set -e rejects `|| true`
  - 'false'
  correct_index: 1
  explanation: '`false || true` is a list whose status is the status of `true`, so the command counts
    as handled and set -e does not exit. The script continues and prints deploying. This is why appending
