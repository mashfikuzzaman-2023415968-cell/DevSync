- id: fastapi-api-design-01
  competency: api_design
  difficulty: 2
  text: Both routes are registered in the order shown. What does GET /users/me return?
  code_snippet: |
    1  @app.get("/users/{user_id}")
    2  def get_user(user_id: str):
    3      return {"route": "by-id"}
    4
    5  @app.get("/users/me")
    6  def get_me():
    7      return {"route": "current-user"}
  options:
  - '{"route": "current-user"}'
  - Status 404
  - '{"route": "by-id"}'
  - Status 422
  correct_index: 2
  explanation: Starlette matches routes in registration order and the first match wins. /users/{user_id}
    also matches /users/me (user_id='me'), so get_me is never reached. Declare the fixed path /users/me
    before the parameterised one.
  check: execution
