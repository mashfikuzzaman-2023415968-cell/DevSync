  competency: api_design
  difficulty: 1
  text: Which request header supplies the value of x_token?
  code_snippet: |
    1  @app.get("/ping")
    2  def ping(x_token: str = Header()):
    3      return {"token": x_token}
  options:
  - x_token, with the underscore kept exactly as written in the code
  - Authorization, as the default header for FastAPI parameters
  - 'None: Header() reads the value from the query string instead'
