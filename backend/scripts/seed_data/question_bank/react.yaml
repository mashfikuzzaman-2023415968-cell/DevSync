- id: react-components-props-06
  competency: components_props
  difficulty: 3
  text: Typing in this input loses focus after every keystroke. What is the cause?
  code_snippet: |
    1  function SignupForm() {
    2    const [email, setEmail] = useState('');
    3    function EmailField() {
    4      return <input value={email} onChange={(e) => setEmail(e.target.value)} />;
    5    }
    6    return <EmailField />;
    7  }
  options:
  - The onChange handler is an inline arrow function, which is recreated on every render and so resets
    the focus
  - The input is controlled, and React drops the focus from controlled inputs after each state update
    it applies
  - EmailField is declared inside SignupForm, so each render creates a new component type and remounts
    the input
  - useState is called before EmailField is defined, so the state update is lost and the input is re-created
  correct_index: 2
  explanation: A component defined inside another component is a new function on every render, so React
    sees a different type, unmounts the old input and mounts a new one (losing focus). Declare EmailField
    outside SignupForm, or call it as a plain function. Inline handlers and controlled inputs do not cause
    this.
  check: execution
  status: APPROVED
  source: CLAUDE_GENERATED
  active: false
  review_level: SELF_VERIFIED
  reviewed_by_name: null
