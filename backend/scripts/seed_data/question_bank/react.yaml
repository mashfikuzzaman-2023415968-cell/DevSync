- id: react-legacy-01
  competency: state_hooks
  difficulty: 3
  text: In React 18, what does automatic batching do?
  options:
  - Merges components
  - Combines several state updates into one re-render, even inside timeouts and promises
  - Delays effects by one second
  - Sends network requests together
  correct_index: 1
  explanation: Since React 18, updates are batched everywhere, including inside timeouts, promises and
    native event handlers, so several setState calls in one tick cause a single re-render. Earlier versions
    batched only inside React event handlers.
