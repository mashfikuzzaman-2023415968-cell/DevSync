  competency: components_props
  difficulty: 3
  text: After the button is clicked once, what text do the list items show, in order?
  code_snippet: |
    1  function Row({ name }) {
    2    const [label] = useState(name);
    3    return <li>{label}</li>;
    4  }
    5  function List() {
    6    const [names, setNames] = useState(['A', 'B', 'C']);
    7    return (
    8      <>
    9        <button onClick={() => setNames(names.slice(1))}>Remove first</button>
    10       <ul>{names.map((n, i) => <Row key={i} name={n} />)}</ul>
    11     </>
    12   );
    13 }
  options:
  - B, C
  - A, B
  - A, B, C
  - C, B
  correct_index: 1
  explanation: With key={i} the rows are matched by position, not by item. After removing the first name,
    row 0 and row 1 keep their existing instances, whose `label` state was initialised once from the old
    props, so they still show A and B and the last row is unmounted. Use a stable id as the key.
