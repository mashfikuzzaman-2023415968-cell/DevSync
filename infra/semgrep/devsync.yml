# DevSync custom Semgrep rules (spec §16.5 step 5). Complements check_forbidden.py.
rules:
  - id: devsync-no-float-money
    languages: [python]
    severity: ERROR
    message: Money must use int paisa or Decimal, never float (spec §0.2 rule 10).
    paths:
      include: ["backend/app/"]
    patterns:
      - pattern-either:
          - pattern: float($X)
          - pattern: "$X: float"
      - metavariable-regex:
          metavariable: $X
          regex: .*_paisa$
  - id: devsync-no-raw-request-role
    languages: [python]
    severity: ERROR
    message: >-
      Never take user or owner ids from a request body (spec §14.20); use the server-side
      principal. (Choosing CLIENT/DEVELOPER at registration is a validated user choice.)
    paths:
      include: ["backend/app/api/"]
    patterns:
      - pattern-inside: |
          def $F(..., $BODY: $SCHEMA, ...):
            ...
      - metavariable-regex:
          metavariable: $SCHEMA
          regex: ^(?!Request$)\w+Request$
      - pattern: $BODY.$FIELD
      - metavariable-regex:
          metavariable: $FIELD
          regex: ^(user_id|owner_id|actor_id|client_id|developer_id|changed_by)$
  - id: devsync-no-compare-secrets
    languages: [python]
    severity: ERROR
    message: Compare secrets with hmac.compare_digest (constant time).
    paths:
      include: ["backend/app/"]
    patterns:
      - pattern-either:
          - pattern: $A == $TOKEN
          - pattern: $TOKEN == $A
      - metavariable-regex:
          metavariable: $TOKEN
          regex: (?i).*(token|secret|otp|signature|digest)$
  - id: devsync-no-dangerous-html
    languages: [typescript]
    severity: ERROR
    message: Never render HTML from strings (spec §13.7).
    paths:
      include: ["frontend/src/"]
    pattern-either:
      - pattern: $EL.innerHTML = $X
      - pattern: <$T dangerouslySetInnerHTML={...} />
