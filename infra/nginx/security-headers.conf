# Security headers for every non-API response (spec §14.3). Included in each
# location because `add_header` in a location replaces inherited headers.
# API responses get the same set from the FastAPI middleware; HSTS is added here for both.
# style-src carries a per-response nonce ($request_id, 128 random bits) for the few UI
# libraries that add a <style> element at runtime (DECISIONS D23); index.html receives the
# same value through sub_filter. script-src never gets a nonce or 'unsafe-inline'.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$request_id'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
