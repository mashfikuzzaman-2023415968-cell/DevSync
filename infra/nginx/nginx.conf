# DevSync edge: TLS, security headers, rate limits, timeouts, compression,
# static SPA and least_conn load balancing over API replicas (spec §5.1, §14.3, §15).
# Runs as an unprivileged user on ports 8080/8443 (published as 80/443).

load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    charset utf-8;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id",'
        '"remote":"$remote_addr","method":"$request_method","uri":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"duration":$request_time,"upstream":"$upstream_addr"}';
    access_log /dev/stdout json;

    # Timeouts (spec §15.3).
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 15s;
    keepalive_timeout 30s;
    client_max_body_size 1m;
    large_client_header_buffers 4 8k;

    # Compression: gzip and brotli for text assets; pre-compressed files when present.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
    brotli on;
    brotli_static on;
    brotli_min_length 1024;
    brotli_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Coarse per-IP rate limits (spec §14.8); fine-grained limits live in the app.
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    # No upstream keepalive: Gunicorn recycles each worker after ~1,000 requests (max_requests),
    # and a request sent on a kept-alive connection the exiting worker just closed came back as a
    # 502 that nginx must not retry for POSTs (D54). A fresh connection per request on the local
    # network costs microseconds and always reaches a live worker via the listening socket.
    upstream api {
        least_conn;
        server api:8000 max_fails=3 fail_timeout=10s;
    }

    # Only these methods are served; TRACE and anything else gets 405 (spec §14.3).
    map $request_method $method_allowed {
        default 0;
        GET 1; HEAD 1; POST 1; PUT 1; PATCH 1; DELETE 1; OPTIONS 1;
    }

    # Host header allowlist (spec §14.3): requests for any other host are rejected here,
    # and redirects/proxying use the configured $server_name, never the client's Host.
    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;
        return 400;
    }

    server {
        listen 8443 ssl default_server;
        listen [::]:8443 ssl default_server;
        server_name _;
        ssl_certificate /etc/nginx/certs/dev.crt;
        ssl_certificate_key /etc/nginx/certs/dev.key;
        return 400;
    }

    # Port 80: redirect to HTTPS (301).
    server {
        listen 8080;
        listen [::]:8080;
        server_name localhost;
        include /etc/nginx/security-headers.conf;
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    server {
        listen 8443 ssl;
        listen [::]:8443 ssl;
        http2 on;
        # Production host names are set here at deployment (Phase 15, DECISIONS D16).
        server_name localhost;

        ssl_certificate /etc/nginx/certs/dev.crt;
        ssl_certificate_key /etc/nginx/certs/dev.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        limit_conn perip 50;
        root /usr/share/nginx/html;

        if ($method_allowed = 0) {
            return 405;
        }

        # Optional admin network allowlist (ADMIN_ALLOWED_CIDRS, spec §14.17).
        include /etc/nginx/conf.d/admin-allow*.conf;

        # Internal-only endpoints are never reachable from outside (spec §10.2, §15.7).
        location = /metrics { return 404; }
        location = /api/v1/health/ready { return 404; }

        location /api/ {
            limit_req zone=api burst=40 nodelay;
            include /etc/nginx/proxy-api.conf;
        }

        location /api/v1/auth/ {
            limit_req zone=auth burst=10 nodelay;
            include /etc/nginx/proxy-api.conf;
        }

        # Upload endpoints accept larger bodies (spec §14.9); added as phases create them.
        location ~ ^/api/v1/(projects/[^/]+/files|me/portfolio/[^/]+/images|me/certificates|me/external-reviews)$ {
            client_max_body_size 25m;
            limit_req zone=api burst=10 nodelay;
            include /etc/nginx/proxy-api.conf;
        }

        # Private files: only reachable through an X-Accel-Redirect from the signed-URL endpoint
        # (spec §14.9). Content-Type, Content-Disposition (always "attachment; filename=…") and
        # Cache-Control come from that API response; these headers are added here.
        location /_protected_files/ {
            internal;
            alias /data/uploads/;
            limit_except GET HEAD { deny all; }
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'none'; sandbox" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        # Hashed build assets are immutable.
        location /assets/ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # Every SPA page load gets a fresh style nonce (DECISIONS D23), so it is never cached.
        location = /index.html {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store" always;
            sub_filter_types text/html;
            sub_filter_once on;
            sub_filter '__CSP_NONCE__' '$request_id';
            gzip_static off;
            brotli_static off;
        }

        # SPA fallback: unknown non-API paths serve index.html; the router shows 404.
        location / {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri /index.html;
        }

        error_page 405 /405.json;
        location = /405.json {
            internal;
            include /etc/nginx/security-headers.conf;
            default_type application/json;
            return 405 '{"error":{"code":"METHOD_NOT_ALLOWED","message":"This action isn\'t supported here.","request_id":"$request_id"}}';
        }
    }
}
