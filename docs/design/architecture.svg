<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 740" width="1260" height="740" font-family="Inter, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">DevSync runtime architecture (through Phase 5)</title>
  <desc id="desc">Browser to Nginx over HTTPS; Nginx serves the SPA and load-balances /api to API replicas (Gunicorn + Uvicorn). API, RQ workers and the scheduler share PostgreSQL 16 (row-level security) and Redis 7. Workers send email to Mailpit in development. Judge0 joins an isolated sandbox network in Phase 13.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1260" height="740" fill="#ffffff"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#0f172a">DevSync — runtime architecture</text>
  <text x="30" y="62" font-size="12" fill="#475569">Through Phase 5 (Demo 1). docker-compose.yml + overlays; only Nginx publishes ports.</text>

  <!-- Networks -->
  <rect x="215" y="190" width="210" height="270" rx="14" fill="#f0fdfa" stroke="#99d5cf" stroke-dasharray="5 4"/>
  <text x="230" y="210" font-size="12" font-weight="600" fill="#64748b">EDGE NETWORK</text>
  <rect x="450" y="80" width="630" height="505" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text x="466" y="100" font-size="12" font-weight="600" fill="#64748b">APP NETWORK</text>
  <rect x="1095" y="190" width="150" height="190" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text x="1108" y="210" font-size="12" font-weight="600" fill="#64748b">SANDBOX</text>
  <text x="1108" y="225" font-size="11" fill="#475569">internal: true</text>

  <!-- Flows (drawn first so boxes sit on top) -->
  <g stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <path d="M180,315 L236,315"/>
    <path d="M400,290 L466,290"/>
    <path d="M320,430 L320,598"/>
    <path d="M965,215 L965,184"/>
    <path d="M760,180 L760,381"/>
    <path d="M520,345 L520,496"/>
    <path d="M1000,345 L1000,496"/>
    <path d="M470,330 L390,600" marker-start="url(#arrow)"/>
    <path d="M660,330 L705,381" marker-start="url(#arrow)"/>
    <path d="M880,330 L815,381" marker-start="url(#arrow)"/>
  </g>
  <path d="M1050,285 L1106,285" stroke="#94a3b8" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-end="url(#arrow-grey)"/>

  <!-- Flow labels -->
  <g font-size="11.5" font-weight="500" fill="#0f766e">
    <text x="186" y="304">HTTPS</text>
    <text x="186" y="336">443</text>
    <text x="404" y="280">/api/*</text>
    <text x="328" y="520">read-only</text>
    <text x="398" y="604">read-write</text>
    <text x="972" y="203">SMTP</text>
    <text x="766" y="205">enqueue</text>
    <text x="845" y="372">dequeue</text>
    <text x="528" y="420">asyncpg</text>
    <text x="1008" y="420">asyncpg</text>
  </g>
  <g font-size="10.5" fill="#475569">
    <text x="186" y="350">80 → 301</text>
    <text x="528" y="436">app.user_id / role</text>
    <text x="1008" y="436">SYSTEM</text>
  </g>

  <!-- Browser -->
  <rect x="30" y="255" width="150" height="120" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="105" y="282" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Browser</text>
  <g font-size="12" fill="#475569" text-anchor="middle">
    <text x="105" y="303">React SPA</text>
    <text x="105" y="321">session cookie</text>
    <text x="105" y="339">(HttpOnly) +</text>
    <text x="105" y="357">CSRF token</text>
  </g>

  <!-- Nginx -->
  <rect x="240" y="230" width="160" height="200" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/>
  <text x="320" y="256" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Nginx</text>
  <text x="320" y="273" text-anchor="middle" font-size="12" fill="#475569">edge + load balancer</text>
  <line x1="256" y1="284" x2="384" y2="284" stroke="#e2e8f0"/>
  <g font-size="12" fill="#475569">
    <text x="254" y="303">TLS 1.2/1.3, HSTS</text>
    <text x="254" y="321">CSP + headers, nonce</text>
    <text x="254" y="339">limit_req per IP</text>
    <text x="254" y="357">body limits, timeouts</text>
    <text x="254" y="375">SPA files (immutable)</text>
    <text x="254" y="393">least_conn → api</text>
    <text x="254" y="411">X-Accel file delivery</text>
  </g>

  <!-- Uploads volume -->
  <path d="M250,612 a70,10 0 0,0 140,0 v44 a70,10 0 0,1 -140,0 z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <ellipse cx="320" cy="612" rx="70" ry="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="320" y="643" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">uploads volume</text>
  <text x="320" y="660" text-anchor="middle" font-size="11" fill="#475569">random keys, 0640</text>

  <!-- API replicas -->
  <rect x="482" y="203" width="190" height="130" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="476" y="209" width="190" height="130" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="470" y="215" width="190" height="130" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/>
  <text x="565" y="241" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">api ×N</text>
  <g font-size="12" fill="#475569" text-anchor="middle">
    <text x="565" y="260">Gunicorn + Uvicorn</text>
    <text x="565" y="278">FastAPI, middleware §14.10</text>
    <text x="565" y="296">stateless; role devsync_app</text>
    <text x="565" y="320" font-size="11">dev/demo: 1 · prod overlay: 3</text>
  </g>

  <!-- Scheduler -->
  <rect x="675" y="110" width="170" height="70" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="760" y="136" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">scheduler</text>
  <g font-size="12" fill="#475569" text-anchor="middle">
    <text x="760" y="155">APScheduler</text>
    <text x="760" y="171">enqueue only</text>
  </g>

  <!-- Mailpit -->
  <rect x="880" y="110" width="170" height="70" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="965" y="136" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Mailpit</text>
  <g font-size="12" fill="#475569" text-anchor="middle">
    <text x="965" y="155">dev / demo SMTP</text>
    <text x="965" y="171">UI 127.0.0.1:8025</text>
  </g>

  <!-- Worker -->
  <rect x="886" y="209" width="170" height="130" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="880" y="215" width="170" height="130" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="965" y="241" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">worker ×M</text>
  <g font-size="12" fill="#475569" text-anchor="middle">
    <text x="965" y="260">RQ: high / default / low</text>
    <text x="965" y="278">email, lifecycle,</text>
    <text x="965" y="296">uploads, attempts,</text>
    <text x="965" y="314">bidding deadline</text>
    <text x="965" y="332" font-size="11">role devsync_worker</text>
  </g>

  <!-- Judge0 (later) -->
  <rect x="1110" y="245" width="120" height="80" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="1170" y="272" text-anchor="middle" font-size="15" font-weight="600" fill="#64748b">Judge0</text>
  <g font-size="12" fill="#475569" text-anchor="middle">
    <text x="1170" y="291">coding tests</text>
    <text x="1170" y="309">Phase 13</text>
  </g>

  <!-- Redis -->
  <rect x="665" y="385" width="190" height="80" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="760" y="410" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Redis 7</text>
  <g font-size="12" fill="#475569" text-anchor="middle">
    <text x="760" y="429">sessions · rate limits</text>
    <text x="760" y="447">cache · RQ queues</text>
  </g>

  <!-- Postgres -->
  <rect x="470" y="500" width="580" height="76" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="760" y="524" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">PostgreSQL 16</text>
  <g font-size="11.5" fill="#475569" text-anchor="middle">
    <text x="760" y="543">RLS ENABLE + FORCE on every table · SECURITY DEFINER helpers · hash-chained audit log</text>
    <text x="760" y="561">roles: migrator (DDL) · app · worker (SYSTEM) · readonly — none has BYPASSRLS</text>
  </g>

  <!-- Legend -->
  <g transform="translate(470,612)" font-size="12" fill="#475569">
    <line x1="0" y1="8" x2="36" y2="8" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="44" y="12">request / data flow</text>
    <rect x="190" y="0" width="28" height="16" rx="4" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
    <text x="226" y="12">data store</text>
    <rect x="320" y="0" width="28" height="16" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text x="356" y="12">dev-only or later phase</text>
    <rect x="530" y="0" width="28" height="16" rx="4" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/>
    <text x="566" y="12">public request path</text>
  </g>
  <g font-size="12" fill="#475569">
    <text x="470" y="664">Containers run non-root with a read-only root FS, no-new-privileges and cap_drop ALL.</text>
    <text x="470" y="682">Migrations run once as devsync_migrator (make migrate). Nginx hides /metrics and /health/ready;</text>
    <text x="470" y="700">/_protected_files/ is internal (reached only through signed-URL downloads).</text>
  </g>
</svg>
