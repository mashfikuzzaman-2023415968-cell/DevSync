<title id="title">DevSync use case diagram (built through Phase 5, later phases marked)</title>
<desc id="desc">UML use case diagram. Actors: Guest, Client, Developer, Newcomer (a kind of Developer), Admin and System/Jobs. Solid teal use cases are built through Phase 5; dashed grey ones are planned for the phase shown.</desc>
