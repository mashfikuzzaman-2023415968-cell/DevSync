# Test overlay used by the phase gate and CI: ephemeral data, test runners (DECISIONS D2).
services:
  # Tests reach Nginx over the internal network; publishing host ports would clash with
  # anything already on 80/443 (e.g. a local Apache) and is not needed.
  nginx:
    ports: !reset []

  postgres:
    # !override replaces (not merges) the base list: no persistent pgdata volume in tests.
    volumes: !override
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    tmpfs: ["/var/lib/postgresql/data:size=512m"]

  redis:
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "", "--appendonly", "no"]
    volumes: !reset []

  api:
    environment:
      DEVSYNC_ENV: test
      GUNICORN_WORKERS: "2"
      # Browsers in the E2E run reach Nginx at https://localhost:8443 (CSRF Origin check).
      PUBLIC_ORIGIN: https://localhost:8443
      SMS_PROVIDER: noop

  worker:
    environment:
      DEVSYNC_ENV: test

  scheduler:
    environment:
      DEVSYNC_ENV: test

  # Backend test runner: same image as dev tooling, connects with the real roles.
  tests:
    build:
      context: ./backend
      target: dev
    image: devsync/backend-dev:local
    profiles: ["tools"]
    # Run as the host user so reports written to ./runs stay owned by them.
    user: "${HOST_UID_GID:-10001:10001}"
    working_dir: /app
    environment:
      DEVSYNC_ENV: test
      ALLOWED_HOSTS: testserver,localhost,api
      SMS_PROVIDER: noop
      DATABASE_URL: postgresql+asyncpg://devsync_app:${DEVSYNC_APP_PASSWORD}@postgres:5432/devsync
      WORKER_DATABASE_URL: postgresql+asyncpg://devsync_worker:${DEVSYNC_WORKER_PASSWORD}@postgres:5432/devsync
      CAPTCHA_HMAC_KEY: ${CAPTCHA_HMAC_KEY}
      PUBLIC_ORIGIN: https://testserver
      MIGRATION_DATABASE_URL: postgresql+psycopg://devsync_migrator:${DEVSYNC_MIGRATOR_PASSWORD}@postgres:5432/devsync
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      EDGE_BASE_URL: https://nginx:8443
      EDGE_HTTP_URL: http://nginx:8080
      HOME: /tmp
      COVERAGE_FILE: /tmp/.coverage
      # Tool caches go to tmpfs: the container's root filesystem is read-only.
      RUFF_CACHE_DIR: /tmp/ruff-cache
      MYPY_CACHE_DIR: /tmp/mypy-cache
      HYPOTHESIS_STORAGE_DIRECTORY: /tmp/hypothesis
    volumes:
      - ./runs:/runs
      - ./docs:/docs:ro
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [app, edge]
